
# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# Use v to trigger selection    
setw -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection     # Begin selection in copy mode.
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # Begin selection in copy mode.
bind-key -T copy-mode-vi 'y' send -X copy-selection      # Yank selection in copy mode.


# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename off

# mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# enable vi mode keys
set-window-option -g mode-keys vi

# set default terminal mode to 256 colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# present a menu of URLs to open from the visible pane. sweet.
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"


# Design Tweaks
# -------------

# Activity/Bell
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Modes
setw -g clock-mode-colour '#FFE08A'
setw -g mode-style 'fg=#000000,bg=#8AB4F8,bold'

# Panes
set -g pane-border-style 'fg=#444444'
set -g pane-active-border-style 'fg=#8AB4F8'

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#F0F0F0,bg=#000000'

# Prefix indicator
set -g status-left '#{?client_prefix,#[fg=#9CFFB0],#[fg=#8AB4F8]} '
set -g status-left-length 10

# Right side
set -g status-right '\
#[bg=default,fg=#8AB4F8]\
#[bg=#8AB4F8,fg=#000000]#{pomodoro_status} \
#[bg=#4A4A4A,fg=#F0F0F0] %Y-%m-%d %H:%M '

# Current window
setw -g window-status-current-style 'fg=#000000,bg=#8AB4F8'
setw -g window-status-current-format '#[fg=#8AB4F8]#[fg=#000000,bg=#8AB4F8] #I #W #F #[fg=#8AB4F8,bg=#000000]'

# Inactive windows
setw -g window-status-style 'fg=#DADADA,bg=#141414'
setw -g window-status-separator ''
setw -g window-status-format ' #I #[fg=#DADADA]#W #[fg=#C58FFF]#F '

# Bell window
setw -g window-status-bell-style 'fg=#000000,bg=#FFE08A,bold'

# Messages
set -g message-style 'fg=#000000,bg=#FFE08A,bold'
# continuum status


# set -g status-right 'Continuum status: #{continuum_status}'

# continuum on
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @continuum-boot-options 'alacritty'

## TPM Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

## resurrect + continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-pomodoro-plus
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @pomodoro_granularity 'on' # 'off'
set -g @pomodoro_notifications 'off' # 'off'
set -g @pomodoro_sound 'Blow' # 'off'
set -g status-interval 1


## forward OSC52 clipboard sequences
set -g set-clipboard on


## tmux-sessionizer keybinds
bind-key -r f run-shell "tmux neww tmux-sessionizer"
bind-key -r h run-shell "tmux-sessionizer s-h"
bind-key -r j run-shell "tmux-sessionizer s-j"
bind-key -r k run-shell "tmux-sessionizer s-k"
bind-key -r l run-shell "tmux-sessionizer s-l"
bind-key -r v run-shell "tmux-sessionizer s-v"

# Pane selection
# bind -n C-M-S-F1 select-pane -t :.1
# bind -n C-M-S-F2 select-pane -t :.2
# bind -n C-S-F1 select-pane -t :.1
# bind -n C-S-F2 select-pane -t :.2

set -s user-keys[0] "\e[1;16P"
set -s user-keys[1] "\e[1;16Q"

bind -n User0 select-pane -t :.1
bind -n User1 select-pane -t :.2
# bind -n '\e[1;16P' select-pane -t :.1
# bind -n '\e[1;16Q' select-pane -t :.2

# automatically split windows (check if it's merge mode passed/mergetool git)
set-hook -g after-new-window 'if -F "#{!=:#{@merge_mode},1}" "split-window -h"'
set-hook -g session-created 'split-window -h'

run '~/.tmux/plugins/tpm/tpm'

set-option -g default-command "reattach-to-user-namespace -l $SHELL"
